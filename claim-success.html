<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gig Claimed – MentorBridge NG</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .success-container {
      text-align: center;
      padding: 60px 20px 40px;
    }

    .success-icon {
      width: 90px;
      height: 90px;
      background: #d1fae5;
      color: #059669;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin: 0 auto 24px;
      font-weight: bold;
    }

    .success-container h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #111827;
    }

    .success-container p {
      color: var(--gray-500);
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .gig-summary {
      background: #f0fdf4;
      border-radius: 16px;
      padding: 18px;
      text-align: left;
      margin-bottom: 32px;
      border: 1px solid #bbf7d0;
    }

    .gig-summary h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .gig-summary .meta {
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page success-container">
      <div class="success-icon">✓</div>

      <h1>Gig Successfully Claimed!</h1>
      <p>You are now assigned to this learning project.</p>

      <div class="gig-summary">
        <h3>Community Literacy Mentor</h3>
        <div class="meta">📍 Kano &nbsp;•&nbsp; 👥 25 Children &nbsp;•&nbsp; ⏱ 2 Weeks</div>
        <span class="badge badge-progress">In Progress</span>
      </div>

      <a href="my-gigs.html" class="btn btn-primary">
        Go to My Gigs
      </a>

      <a href="home.html" class="btn btn-outline" style="margin-top: 12px; display: block;">
        Back to Home
      </a>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
