<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gig Claimed – MentorBridge NG</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0A7A4B;
      --primary-dark: #065F3A;
      --primary-light: #D1FAE5;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: var(--gray-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .success-card {
      background: white;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }

    .success-icon {
      width: 90px;
      height: 90px;
      background: #d1fae5;
      color: #059669;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      margin: 0 auto 24px;
    }

    .success-card h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .success-card p {
      color: var(--gray-500);
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .gig-summary {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      margin-bottom: 32px;
    }
    .gig-summary h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .gig-summary .meta {
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 10px;
    }
    .badge {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #dbeafe;
      color: #1e40af;
    }

    .btn-primary {
      display: block;
      width: 100%;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 15px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 12px;
    }
    .btn-outline {
      display: block;
      width: 100%;
      background: white;
      border: 1.5px solid var(--gray-200);
      color: var(--gray-700);
      font-weight: 600;
      font-size: 15px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon">✓</div>

    <h1>Gig Successfully Claimed!</h1>
    <p>You are now assigned to this learning project.</p>

    <div class="gig-summary">
      <h3>Community Literacy Mentor</h3>
      <div class="meta">📍 Kano • 👥 25 Children • ⏱ 2 Weeks</div>
      <span class="badge">In Progress</span>
    </div>

    <a href="my-gigs.html" class="btn-primary">Go to My Gigs</a>
    <a href="home.html" class="btn-outline">Back to Home</a>
  </div>
</body>
</html>
