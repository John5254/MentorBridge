<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorBridge NG – Login</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-container {
      padding-top: 60px;
    }

    .logo {
      width: 70px;
      height: 70px;
      background: var(--primary);
      border-radius: 20px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

    .error-message {
      background: #fef2f2;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .loading-btn {
      opacity: 0.7;
      pointer-events: none;
    }

    .hint {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 12px;
      text-align: center;
      background: #f0fdf4;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page login-container">
      
      <div class="text-center mb-4">
        <div class="logo">MB</div>
        <h1 style="font-size: 24px; margin-bottom: 8px;">Welcome Back</h1>
        <p style="color: var(--gray-500);">Login to continue to MentorBridge NG</p>
      </div>

      <div class="card">
        <div id="error-message" class="error-message">
          Incorrect email or password.
        </div>

        <div class="form-group">
          <label>Email</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Enter your email"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </div>

        <button id="login-btn" class="btn btn-primary" onclick="handleLogin()">
          Login
        </button>

        <div class="hint">
          <strong>For testing (no backend yet):</strong><br>
          Email: <code>johnbeloved@mentorbridge.ng</code><br>
          Password: <code>password123</code>
        </div>
      </div>

      <p class="text-center mt-4" style="font-size: 14px; color: var(--gray-500);">
        Don’t have an account? 
        <a href="#" style="color: var(--primary); font-weight: 600;"><a href="register.html"> Register</a>
      </p>

      <p class="text-center mt-2">
        <a href="index.html" style="font-size: 14px; color: var(--gray-500);">← Back to Home</a>
      </p>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    function handleLogin() {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("error-message");
      const loginBtn = document.getElementById("login-btn");

      errorMsg.style.display = "none";

      if (!email || !password) {
        errorMsg.textContent = "Please enter both email and password.";
        errorMsg.style.display = "block";
        return;
      }

      // Only allow the correct credentials
      if (email === "johnbeloved@mentorbridge.ng" && password === "password123") {
        loginBtn.textContent = "Logging in...";
        loginBtn.classList.add("loading-btn");

        setTimeout(() => {
          // Redirect to the Home Dashboard
          window.location.href = "home.html";
        }, 1000);
      } else {
        errorMsg.textContent = "Incorrect email or password.";
        errorMsg.style.display = "block";
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        handleLogin();
      }
    });
  </script>
</body>
</html>
