<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – MentorBridge NG</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0A7A4B;
      --primary-dark: #065F3A;
      --primary-light: #D1FAE5;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: var(--gray-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }

    .login-card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: contain;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .logo-section h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .logo-section p {
      color: var(--gray-500);
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--gray-700);
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--gray-200);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .error-message {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 15px;
      padding: 15px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 20px;
      background: #f0fdf4;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: var(--gray-600);
      text-align: center;
    }

    .hint code {
      background: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .footer-links {
      margin-top: 28px;
      text-align: center;
      font-size: 14px;
      color: var(--gray-500);
    }

    .footer-links a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--gray-500);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-section">
      <img src="https://i.ibb.co/8nRZn2D5/IMG-20261008-WA0030.jpg" alt="MentorBridge Logo" class="logo">
      <h1>Welcome Back</h1>
      <p>Login to continue to MentorBridge NG</p>
    </div>

    <div id="error-message" class="error-message">
      Incorrect email or password.
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
    </div>

    <button class="btn-primary" id="login-btn" onclick="handleLogin()">
      Login
    </button>

    <div class="hint">
      <strong>For testing (no backend yet):</strong><br>
      Email: <code>johnbeloved@mentorbridge.ng</code><br>
      Password: <code>password123</code>
    </div>

    <div class="footer-links">
      Don’t have an account? <a href="register.html">Register</a>
    </div>

    <a href="index.html" class="back-home">← Back to Home</a>
  </div>

  <script>
    function handleLogin() {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("error-message");
      const loginBtn = document.getElementById("login-btn");

      errorMsg.style.display = "none";

      if (!email || !password) {
        errorMsg.textContent = "Please enter both email and password.";
        errorMsg.style.display = "block";
        return;
      }

      if (email === "johnbeloved@mentorbridge.ng" && password === "password123") {
        loginBtn.textContent = "Logging in...";
        loginBtn.disabled = true;

        setTimeout(() => {
          window.location.href = "home.html";
        }, 1000);
      } else {
        errorMsg.textContent = "Incorrect email or password.";
        errorMsg.style.display = "block";
      }
    }

    // Allow Enter key to login
    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        handleLogin();
      }
    });
  </script>
</body>
  </html>
